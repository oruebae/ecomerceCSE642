name: Despliegue Continuo a Microsoft Azure App Service

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Frontend en Vite
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Empaquetar artefacto de despliegue para Azure
        run: |
          mkdir deploy_package
          if [ -d "dist" ]; then
            cp -r dist/* deploy_package/
          elif [ -d "build" ]; then
            cp -r build/* deploy_package/
          fi
          [ -f package.json ] && cp package.json deploy_package/ || true
          [ -f package-lock.json ] && cp package-lock.json deploy_package/ || true
          [ -f server_mcp.js ] && cp server_mcp.js deploy_package/ || true
          [ -f web.config ] && cp web.config deploy_package/ || true
          [ -f process.json ] && cp process.json deploy_package/ || true

      - name: Desplegar en Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'alelilecommerce'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: './deploy_package'